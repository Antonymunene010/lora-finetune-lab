[project]
name = "lora-finetune-lab"
version = "0.1.0"
description = "Lightweight, modular implementation of LoRA (Low-Rank Adaptation) and parameter-efficient fine-tuning in pure PyTorch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
